<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日のワーク</title>
    <!-- Firebase と Marked.js のライブラリを読み込む -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* CSSスタイルは変更なし */
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;line-height:1.8;color:#333;background-color:#fdfdfd;margin:0;padding:20px}.container{max-width:720px;margin:20px auto;padding:30px;background-color:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.05)}h1,h2{border-bottom:2px solid #eee;padding-bottom:10px;margin-top:40px}textarea{width:98%;min-height:120px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:16px;line-height:1.7;margin-top:10px;resize:vertical}.actions-container{margin-top:50px;padding-top:20px;border-top:2px solid #eee;text-align:center}.action-button{display:inline-block;padding:12px 24px;margin:5px;font-size:16px;font-weight:700;color:#fff;background-color:#007bff;border:none;border-radius:8px;cursor:pointer;transition:background-color .2s}.action-button:hover{background-color:#0056b3}.action-button.print{background-color:#28a745}.action-button.print:hover{background-color:#218838}@media print{.actions-container{display:none}}
    </style>
</head>
<body>
    <div id="content" class="container">
        <h1>読み込み中...</h1>
        <p>コンテンツを準備しています。少々お待ちください。</p>
    </div>

    <script>
        // --- ★★★ ここにfirebaseConfigを貼り付け ★★★ ---
        const firebaseConfig = {
            apiKey: "AIzaSyBhRYlbL9trWJz1uIZJhBdpQP8ocIxI8QI",
    authDomain: "merumaga-app-final.firebaseapp.com",
    projectId: "merumaga-app-final",
    storageBucket: "merumaga-app-final.firebasestorage.app",
    messagingSenderId: "641649378313",
    appId: "1:641649378313:web:0a5f2f557ddce179a724d8"
  };

        // --- ★★★ 貼り付けはここまで ★★★ ---

        // Firebaseを初期化
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.onload = async function() {
            const contentDiv = document.getElementById('content');
            try {
                // 1. URLから「整理番号(id)」を取得
                const params = new URLSearchParams(window.location.search);
                const docId = params.get('id');

                if (!docId) { throw new Error("整理番号が見つかりません。"); }

                // 2. Firestoreに問い合わせて、設計図を取得
                const docRef = db.collection("works").doc(docId);
                const doc = await docRef.get();

                if (!doc.exists) { throw new Error("指定されたワークが見つかりません。"); }
                
                const markdownText = doc.data().content;

                // 3. ページを組み立てる（ここは今までと同じ）
                let htmlContent = marked.parse(markdownText);
                htmlContent = htmlContent.replace(/\[INPUT\]/g, '<textarea placeholder="ここに書き込んでみましょう..."></textarea>');
                contentDiv.innerHTML = htmlContent;

                // 4. ボタンを追加する（ここは今までと同じ）
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions-container';
                const printButton = document.createElement('button');
                printButton.textContent = '🖨️ このページを印刷する';
                printButton.className = 'action-button print';
                printButton.onclick = function() { window.print(); };
                actionsDiv.appendChild(printButton);
                const downloadButton = document.createElement('button');
                downloadButton.textContent = '📄 テキストで保存する';
                downloadButton.className = 'action-button';
                downloadButton.onclick = function() { downloadAsText(); };
                actionsDiv.appendChild(downloadButton);
                contentDiv.appendChild(actionsDiv);

            } catch (e) {
                contentDiv.innerHTML = `<h1>エラー</h1><p>コンテンツの読み込みに失敗しました。</p><p><i>詳細: ${e.message}</i></p>`;
                console.error("Error loading content:", e);
            }
        };

        function downloadAsText() {
            // ダウンロード機能は変更なし
            let textContent='';const contentDiv=document.getElementById('content');const title=contentDiv.querySelector('h1')?.textContent||'My Work';textContent+=`# ${title}\n\n`;contentDiv.childNodes.forEach(node=>{if(node.nodeName.startsWith('H')){textContent+=`\n## ${node.textContent}\n\n`}else if(node.nodeName==='P'||node.tagName==='BLOCKQUOTE'){textContent+=`${node.textContent}\n\n`}else if(node.tagName==='TEXTAREA'){textContent+=`【あなたの回答】\n${node.value}\n\n`}});const blob=new Blob([textContent],{type:'text/plain;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`${title}.txt`;link.click();URL.revokeObjectURL(link.href)
        }
    </script>
</body>
</html>
